name: Build and Release Executable

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allow running manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Best version for pyinstaller stability
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pygame pillow pyinstaller
        
    - name: Build Executable
      run: |
        python build.py
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-CLUB_Buzzer
        path: dist/AI-CLUB_Buzzer.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: AI-CLUB_Buzzer
        path: dist
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/AI-CLUB_Buzzer.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
